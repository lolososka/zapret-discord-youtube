<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Страница не найдена — Zapret Control Center</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }

      display: grid;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      background: #05070a;
      color: #eaeff6;

    main {
      width: min(560px, calc(100% - 32px));

      border: 1px solid #262d37;
      background: #090c11;
    }
    span {
      color: #8b57ff;
      font: 600 0.7rem "Cascadia Mono", Consolas, monospace;
      letter-spacing: 0.14em;
    }
    h1 { margin: 18px 0 12px; font-size: clamp(2.4rem, 9vw, 4.2rem); line-height: 1; letter-spacing: -0.055em; }
    p { margin: 0 0 28px; color: #94a1b2; line-height: 1.65; }
    a {
      display: inline-flex;
      min-height: 48px;
      padding: 0 18px;
      align-items: center;
      border: 1px solid #6e5cff;
      background: #6e5cff;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <span>ERROR / 404</span>
