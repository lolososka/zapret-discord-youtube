name: Auto comment on new issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Explain where to collect diagnostics
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Спасибо за сообщение.

            Если проблема относится к **Zapret Control Center, updater или portable-сборке**:

            1. Откройте в GUI страницу **«Диагностика»** и нажмите **«Проверить всё»**.
            2. Нажмите **«Собрать отчёт»** и приложите полученный ZIP к Issue.
            3. Укажите, на каком шаге произошёл сбой: проверка, скачивание, распаковка, замена, перезапуск или откат.

            Отчёт не содержит содержимое пользовательских списков, внешний IP, Telegram secret,
            имя пользователя и полные локальные пути. Его всё равно можно открыть архиватором и
            проверить перед отправкой.

            Если ошибка воспроизводится **без GUI** в самой стратегии, списке или `service.bat`,
            проверьте [README Flowseal](https://github.com/Flowseal/zapret-discord-youtube/blob/main/README.md)
            и существующие [Issues upstream](https://github.com/Flowseal/zapret-discord-youtube/issues).

            Не публикуйте секреты Telegram, содержимое приватных списков и другие личные данные.
